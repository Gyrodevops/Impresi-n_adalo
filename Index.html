<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Impresión de Pantalla</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #fff; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .print-container {
            width: 100%;
            text-align: center;
        }
        img { 
            max-width: 100%; 
            height: auto; 
            display: block;
            margin: 0 auto;
        }
        @media print {
            body { 
                height: auto; 
            }
            .no-print { 
                display: none !important; 
            }
        }
    </style>
</head>
<body>
    <div class="print-container">
        <img id="pantalla-img" src="" alt="Cargando impresión...">
    </div>

    <script>
        const p = new URLSearchParams(window.location.search);
        const imageUrl = p.get('img');

        if (imageUrl) {
            document.getElementById('pantalla-img').src = decodeURIComponent(imageUrl);
        } else {
            document.getElementById('pantalla-img').alt = 'No se encontró la imagen a imprimir.';
        }

        // Esperar a que la imagen cargue completamente antes de imprimir
        document.getElementById('pantalla-img').onload = function() {
            window.print();
        };
    </script>
</body>
</html>
